<!doctype html>
<html lang="th">
<head>
<title>ศูนย์ปฏิบัติการกลุ่มจังหวัด 4</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ศูนย์ปฏิบัติการกลุ่มจังหวัด 4 — ระบบรายงานการบริหารงานแบบกลุ่มจังหวัด สำนักงานปลัดกระทรวงยุติธรรม">
<meta name="theme-color" content="#1b2a5c">
<link rel="icon" type="image/png" href="img/moj-logo.png">
<link rel="apple-touch-icon" href="img/moj-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column of cards; a light top bar with icon menu (bottom tab bar on phones); navy for actions, brass only for deadlines and progress. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f1f3f7; --surface-3:#e4e7ee;
  --ink:#18203a; --ink-2:#4a5370; --muted:#7a8199; --line:#e1e4ec;
  --band:#1b2a5c; --band-2:#25387a; --band-ink:#ffffff; --band-soft:#e8ecf7;
  --brass:#946f1f; --brass-strong:#7a5a14; --brass-soft:#f6eedb; --on-brass:#ffffff;
  --line-green:#06c755; --line-green-ink:#ffffff;
  --focus:#2a78d6;
  --good:#0ca30c; --good-ink:#0b7a0b; --good-soft:#e2f4e2;
  --warn:#fab219; --warn-ink:#7d5200; --warn-soft:#fdf2d8;
  --bad:#d03b3b; --bad-ink:#b42318; --bad-soft:#fbe6e4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --q1:#cde2fb; --q2:#9ec5f4; --q3:#6da7ec; --q4:#3987e5; --q5:#256abf; --q6:#184f95;
  --nodata:#e4e6ec; --context:#e9ebf0; --context-line:#ffffff; --map-sea:#eaf1f8;
  --grid:#e6e8ee; --axis:#c3c6d1;
  --paper:#ffffff; --paper-ink:#151515; --paper-line:#5a5a5a; --paper-head:#e6e9f0; --paper-shade:#f2f3f6;
  --f-display:'Noto Serif Thai','Sarabun',Georgia,serif;
  --f-body:'Sarabun','Leelawadee UI','Thonburi',system-ui,sans-serif;
  --f-data:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif;
  --r:16px; --r-s:10px;
  --shadow:0 1px 2px rgba(24,32,58,.05),0 6px 20px rgba(24,32,58,.05);
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e121d; --surface:#161c2b; --surface-2:#1c2335; --surface-3:#272f46;
  --ink:#e9ecf4; --ink-2:#b5bbcd; --muted:#878ea6; --line:#29314a;
  --band:#3a5bc7; --band-2:#4a6bd6; --band-ink:#ffffff; --band-soft:#1f2a4d;
  --brass:#d2ac58; --brass-strong:#e2c07a; --brass-soft:#2d2716; --on-brass:#1a1406;
  --line-green:#06c755; --line-green-ink:#ffffff;
  --focus:#5598e7;
  --good:#0ca30c; --good-ink:#4cc24c; --good-soft:#132f1a;
  --warn:#fab219; --warn-ink:#f5c45a; --warn-soft:#3a2d0c;
  --bad:#d03b3b; --bad-ink:#f08080; --bad-soft:#3a1717;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --q1:#184f95; --q2:#256abf; --q3:#3987e5; --q4:#6da7ec; --q5:#9ec5f4; --q6:#cde2fb;
  --nodata:#262d42; --context:#1b2133; --context-line:#0e121d; --map-sea:#111829;
  --grid:#232a3e; --axis:#39405a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e121d; --surface:#161c2b; --surface-2:#1c2335; --surface-3:#272f46;
  --ink:#e9ecf4; --ink-2:#b5bbcd; --muted:#878ea6; --line:#29314a;
  --band:#3a5bc7; --band-2:#4a6bd6; --band-ink:#ffffff; --band-soft:#1f2a4d;
  --brass:#d2ac58; --brass-strong:#e2c07a; --brass-soft:#2d2716; --on-brass:#1a1406;
  --line-green:#06c755; --line-green-ink:#ffffff;
  --focus:#5598e7;
  --good:#0ca30c; --good-ink:#4cc24c; --good-soft:#132f1a;
  --warn:#fab219; --warn-ink:#f5c45a; --warn-soft:#3a2d0c;
  --bad:#d03b3b; --bad-ink:#f08080; --bad-soft:#3a1717;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --q1:#184f95; --q2:#256abf; --q3:#3987e5; --q4:#6da7ec; --q5:#9ec5f4; --q6:#cde2fb;
  --nodata:#262d42; --context:#1b2133; --context-line:#0e121d; --map-sea:#111829;
  --grid:#232a3e; --axis:#39405a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
a{color:var(--focus)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.small{font-size:.86rem;color:var(--ink-2)}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;height:var(--nav-h);display:flex;align-items:center;gap:16px}
.mark{width:42px;height:42px;flex:none;display:block;border-radius:50%;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}
.help-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;cursor:pointer;font-size:.88rem;font-weight:500;flex:none}
.help-btn:hover{background:var(--surface-2);color:var(--ink)}
.help-btn[aria-current="page"]{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.brand{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.brand b{font-family:var(--f-display);font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){.brand b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:.95rem;line-height:1.3}}
.brand span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{appearance:none;border:0;background:transparent;color:var(--ink-2);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.95rem;white-space:nowrap;position:relative}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--band);color:var(--band-ink)}
.me-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;font-size:.9rem;max-width:170px;position:relative;flex:none;color:var(--ink);min-height:38px}
.me-chip:hover{border-color:var(--ink-2)}
.me-chip[aria-current="page"]{border-color:var(--band);box-shadow:0 0 0 2px var(--band-soft)}
.me-chip img,.me-chip .who-ico{width:30px;height:30px;border-radius:50%;flex:none}
.me-chip .who-ico{display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.me-chip .who-ico .ico{width:18px;height:18px}
.me-chip #who-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.me-chip .badge,.nav .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;line-height:18px;text-align:center;font-family:var(--f-data);font-weight:600;box-shadow:0 0 0 2px var(--surface)}
.nav .badge{top:-3px;right:-3px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)}
.dot.off{background:var(--warn)}
@media (max-width:1020px){ .nav button span.lbl{display:none} .nav button{padding:9px 12px} }
@media (max-width:760px){
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);z-index:25;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));gap:0}
  .nav button{flex-direction:column;gap:2px;padding:6px 4px;font-size:.7rem;border-radius:12px;flex:1;min-width:0}
  .nav button span.lbl{display:block}
  .nav button[aria-current="page"]{background:var(--band-soft);color:var(--band)}
  .nav .badge{right:calc(50% - 22px)}
  .me-chip #who-name{display:none} .me-chip{padding:3px}
  .help-btn{margin-left:auto}
  .mark{width:36px;height:36px}
  .brand span{display:none}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.view{display:flex;flex-direction:column;gap:18px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h h1{font-family:var(--f-display);font-size:1.55rem;font-weight:700}
.page-h p{color:var(--ink-2);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:1.12rem;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.card h2 small{font-weight:400;font-size:.84rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.cols-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.cols-2{grid-template-columns:1fr}}
.notice{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);font-size:.92rem;flex-wrap:wrap}
.notice .grow{flex:1;min-width:min(100%,240px)}
.notice.demo{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.notice.info{background:var(--band-soft);border-color:transparent}
.notice.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.notice.good{background:var(--good-soft);border-color:transparent}
details.more{border-top:1px dashed var(--line);padding-top:12px}
details.more > summary{cursor:pointer;font-weight:600;color:var(--band);list-style:none;display:flex;align-items:center;gap:8px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.more[open] > summary::before{transform:rotate(45deg)}
details.more > .in{margin-top:14px;display:flex;flex-direction:column;gap:18px}
:root[data-theme="dark"] details.more > summary{color:var(--q5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) details.more > summary{color:var(--q5)}}

/* ---------- buttons ---------- */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;font-size:.94rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;color:var(--ink);min-height:42px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.btn.primary:hover{background:var(--band-2);border-color:var(--band-2)}
.btn.line{background:var(--line-green);color:var(--line-green-ink);border-color:var(--line-green)}
.btn.line:hover{filter:brightness(1.05)}
.btn.brass{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 11px;font-size:.84rem;min-height:34px;border-radius:10px}
.btn.big{padding:13px 20px;font-size:1rem;min-height:52px}
.btn.danger{color:var(--bad-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .ico{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}

/* ---------- pills, chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.idle{background:var(--surface-2);color:var(--muted)}
.pill.brand{background:var(--band-soft);color:var(--band)}
:root[data-theme="dark"] .pill.brand{color:var(--q5)}
.pill svg{width:12px;height:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{width:10px;height:10px;border-radius:3px;flex:none}
.seg-tabs{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg-tabs button{appearance:none;border:0;background:transparent;border-radius:9px;padding:7px 16px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.seg-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- home ---------- */
.hello h1{font-family:var(--f-display);font-size:1.7rem;font-weight:700}
.hello p{color:var(--ink-2);margin-top:4px}
.next{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:560px){.next{gap:14px;align-items:start}.datebox{width:72px}.datebox .d{font-size:1.7rem}}
.datebox{width:96px;border-radius:14px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--surface)}
.datebox .m{background:var(--brass);color:var(--on-brass);font-size:.82rem;font-weight:600;padding:4px 0}
.datebox .d{font-family:var(--f-data);font-size:2.2rem;font-weight:600;line-height:1.2;padding-top:6px}
.datebox .y{font-size:.78rem;color:var(--muted);padding-bottom:8px}
.countdown{display:inline-flex;align-items:baseline;gap:6px;font-weight:600}
.countdown b{font-family:var(--f-data);font-size:1.6rem;color:var(--brass-strong)}
.countdown.late b{color:var(--bad-ink)}
.offices{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.office{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);cursor:pointer;text-align:left;appearance:none;font:inherit;color:inherit}
.office:hover{border-color:var(--ink-2)}
.office b{display:block;font-size:.98rem}
.office span{font-size:.8rem;color:var(--muted)}
.pring{width:52px;height:52px}
.pring .bg{fill:none;stroke:var(--surface-3);stroke-width:6}
.pring .fg{fill:none;stroke:var(--good);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .4s}
.pring .fg.mid{stroke:var(--brass)}
.pring .fg.low{stroke:var(--bad)}
.pring text{font-family:var(--f-data);font-size:13px;font-weight:600;fill:var(--ink)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.qbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;box-shadow:var(--shadow);color:var(--ink)}
.qbtn:hover{border-color:var(--band)}
.qbtn .qi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--band-soft);color:var(--band);flex:none}
:root[data-theme="dark"] .qbtn .qi{color:var(--q5)}
.qbtn .qi .ico{width:24px;height:24px}
.qbtn b{display:block;font-size:1rem}
.qbtn span{font-size:.84rem;color:var(--ink-2)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.todo li .t{display:flex;gap:10px;align-items:center;min-width:0}
.todo li .t span{min-width:0}
.todo .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--axis);flex:none;display:grid;place-items:center}
.todo .box.ok{background:var(--good);border-color:var(--good);color:#fff}
.todo .box svg{width:12px;height:12px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k-l{font-size:.86rem;color:var(--ink-2)}
.kpi .k-v{font-family:var(--f-data);font-size:1.75rem;font-weight:600;line-height:1.25}
.kpi .k-v small{font-size:.86rem;font-weight:500;color:var(--ink-2);margin-left:4px}
.kpi .k-s{font-size:.82rem;color:var(--muted)}
.meter{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--s1);border-radius:4px}
.meter.brass i{background:var(--brass)}
.meter.good i{background:var(--good)}
.chart-box{position:relative;height:270px;min-width:0}
.chart-box.tall{height:320px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:10px;align-items:center;font-size:.88rem}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.hbar .b{height:10px;background:var(--surface-3);border-radius:0 4px 4px 0;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.hbar .v{font-family:var(--f-data);font-variant-numeric:tabular-nums;min-width:3.5em;text-align:right}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
table.dt{border-collapse:collapse;width:100%;font-size:.88rem}
table.dt th,table.dt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.dt th{background:var(--surface-2);font-weight:600;white-space:nowrap;position:sticky;top:0}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
@media (max-width:760px){#toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
#toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;box-shadow:var(--shadow)}
#toast div.err{background:var(--bad-ink);color:#fff}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- UX v3: task-first home, simpler forms, cleaner cards ---------- */
.eyebrow{font-size:.8rem;font-weight:600;color:var(--brass-strong);letter-spacing:.02em}
.hero{gap:16px;border-color:color-mix(in srgb,var(--band) 22%,var(--line))}
.hero-top{display:flex;gap:16px;align-items:center;justify-content:space-between}
.hero-top h2{font-family:var(--f-display);font-size:1.3rem;font-weight:700;display:block;margin-top:2px}
.hero-top p{margin-top:4px}
.hero .pring{width:68px;height:68px;flex:none}
.meter.big{height:10px;margin-top:0}
.btn.wrap{white-space:normal;text-align:left;line-height:1.35}
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;counter-reset:st}
.stepper li{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:.9rem;color:var(--muted);font-weight:500;min-width:0}
.stepper .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--ink-2);font-family:var(--f-data);font-size:.8rem;font-weight:600}
.stepper .n svg{width:13px;height:13px}
.stepper li.now{background:var(--band-soft);color:var(--ink)}
.stepper li.now .n{background:var(--band);color:var(--band-ink)}
.stepper li.done{color:var(--good-ink)}
.stepper li.done .n{background:var(--good);color:#fff}
@media (max-width:560px){.stepper{gap:6px}.stepper li{flex-direction:column;gap:4px;padding:8px 4px;font-size:.78rem;text-align:center;justify-content:center}
  .hero .pring{width:54px;height:54px}.hero-top h2{font-size:1.15rem}.hero .row .btn{flex:1 1 100%}}
.checklist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:10px}
.checklist li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px;align-items:start;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.checklist .box{width:26px;height:26px;border-radius:50%;border:2px solid var(--axis);display:grid;place-items:center;background:var(--surface)}
.checklist li.ok .box{background:var(--good);border-color:var(--good);color:#fff}
.checklist .box svg{width:13px;height:13px}
.checklist b{font-size:.98rem;display:block}
.checklist li.ok b{color:var(--ink-2);font-weight:500}
.checklist .d{font-size:.86rem;color:var(--ink-2)}
.checklist .acts{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.qa button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;color:var(--ink);font-weight:600;font-size:.95rem;min-height:62px;box-shadow:var(--shadow)}
.qa button:hover{border-color:var(--band)}
.qa .qi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--band-soft);color:var(--band);flex:none}
:root[data-theme="dark"] .qa .qi{color:var(--q5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qa .qi{color:var(--q5)}}
.qa .qi .ico{width:21px;height:21px}
@media (max-width:560px){.qa{grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px}.qa button{flex-direction:column;gap:6px;padding:12px 4px;text-align:center;font-size:.78rem;line-height:1.3;min-height:0;font-weight:500}}
.plist{display:flex;flex-direction:column}
.prow{appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(70px,1fr) 3.4em 6.6em;gap:12px;align-items:center;padding:11px 4px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;border-radius:0}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--surface-2)}
.prow .pn{display:flex;flex-direction:column;min-width:0}
.prow .pn b{font-size:.96rem;font-weight:600;display:flex;align-items:center;gap:8px}
.prow .pn small{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .sw{width:9px;height:9px;border-radius:3px;flex:none}
.prow .pbar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.prow .pbar i{display:block;height:100%;border-radius:4px;background:var(--good)}
.prow .pbar i.mid{background:var(--brass)}.prow .pbar i.low{background:var(--bad)}
.prow .pv{font-family:var(--f-data);font-size:.88rem;text-align:right;color:var(--ink-2)}
.prow .pill{justify-self:end}
@media (max-width:560px){.prow{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}.prow .pbar{grid-column:1}.prow .pv{grid-column:2;grid-row:2}.prow .pill{grid-row:1;grid-column:2}}
.next-mini{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:4px}
.nm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.nm:last-child{border-bottom:0}
.nm .dl-date{width:50px}
.nm b{font-size:.94rem;font-weight:600;display:block;line-height:1.4}
.nm .msgbox{grid-column:1/-1}
.todo.two{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:8px}
.todo li{min-height:48px}
/* entry */
.step-pick{display:none;flex-direction:column;gap:6px}
.step-pick label{font-size:.86rem;color:var(--ink-2)}
.step-pick .sp-row{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px}
.step-pick select{appearance:auto;width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;font-weight:600;font-size:1rem;color:var(--ink)}
.step-pick .btn{min-height:48px;padding:0}
@media (max-width:900px){.step-pick{display:flex}.wiz .steps{display:none}}
.fset legend{float:left;width:100%;padding:0;margin:0 0 2px;font-weight:600;font-size:1rem;color:var(--ink)}
.fset legend + *{clear:both}
@media (max-width:640px){
  .wiz .card.form{padding:16px 14px}
  .fset{border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 0 0;background:transparent}
  .wiz-foot{gap:8px;padding-top:10px;padding-bottom:10px}
  .wiz-foot .msg{display:none}
  .wiz-foot .btn{flex:1;padding:9px 10px}
  .wiz-foot .btn.prev{flex:0 0 48px;padding:0}
  .wiz-foot .btn.prev .t{display:none}
  .page-h h1{font-size:1.4rem}
}
.save-state{font-size:.82rem;color:var(--muted)}
/* calendar */
.dl-top{grid-template-columns:auto minmax(0,1fr)}
.dl-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.dl .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.dl .note{font-size:.86rem;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.dl.remind{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.dl.past{opacity:.8}
.dl .acts{gap:8px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--r-s);background:var(--brass-soft);border:1px solid color-mix(in srgb,var(--brass) 40%,transparent);font-size:.94rem;flex-wrap:wrap}
.banner .ico{color:var(--brass-strong)}
.banner .grow{flex:1;min-width:min(100%,220px)}
@media (max-width:900px){.cal-layout > .upcoming{order:-1}}
/* overview */
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .k-v{white-space:nowrap;font-size:clamp(1.35rem,2.4vw,1.75rem)}
/* downloads */
.sec-h{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.sec-h h2{font-size:1.15rem;font-weight:700}
.sec-h p{font-size:.9rem;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:12px}
.opts .lab{font-size:.86rem;color:var(--ink-2);font-weight:600}
.dlc .card{gap:12px}
.dlc .card .btn{margin-top:auto}
.dlc .card .row{flex-wrap:nowrap;align-items:flex-start}
/* account */
.acc{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.acc{grid-template-columns:1fr}}
.acc > div{display:flex;flex-direction:column;gap:18px;min-width:0}
.reg .row select{min-height:38px}
.reg .pickrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px}
.reg .pickrow label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--ink-2)}
.reg .pickrow select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);color:var(--ink);font-size:.92rem}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.checks.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.checks.grid label{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
details.card > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:1.12rem}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);margin-right:6px;transition:transform .15s}
details.card[open] > summary::after{transform:rotate(-135deg)}
details.card > summary small{font-weight:400;font-size:.84rem;color:var(--muted);margin-left:auto}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:10px;padding:8px 8px 8px 12px;font-family:var(--f-data);font-size:.84rem;min-width:0}
@media (min-width:901px){.home-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 16px;background:radial-gradient(120% 70% at 50% 0%, var(--band-soft), var(--bg))}

.gate h2{font-size:1.1rem}

  { id:'situations', title:'สถานการณ์ปัญหาในพื้นที่',      ref:'หัวข้อ ๕',   keys:['situations'] },

];

const TH_DIGITS = '๐๑๒๓๔๕๖๗๘๙';
const toTh = s => String(s).replace(/[0-9]/g, d => TH_DIGITS[d]);
const isNum = v => v !== null && v !== undefined && v !== '' && !isNaN(Number(v));
const num = v => isNum(v) ? Number(v) : 0;
const fmtNum = (v, dp) => isNum(v) ? Number(v).toLocaleString('en-US', { maximumFractionDigits: dp == null ? 2 : dp }) : '-';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pct = (a, b) => b > 0 ? a / b * 100 : null;

function isObj(v){ return v && typeof v === 'object' && !Array.isArray(v); }
function deepMerge(base, over){
  if (!isObj(over)) return base;
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  for (const k of Object.keys(over)){
    const v = over[k];
    if (isObj(v) && isObj(out[k])) out[k] = deepMerge(out[k], v);
    else if (v !== undefined) out[k] = v;
  }
  return out;
}
function getPath(o, p){ return p.split('.').reduce((a, k) => a == null ? undefined : a[k], o); }
function setPath(o, p, v){
  const ks = p.split('.'); let cur = o;
  for (let i = 0; i < ks.length - 1; i++){
    const k = ks[i], nk = ks[i+1];
    if (cur[k] == null) cur[k] = {};
    cur = cur[k];
  }
  cur[ks[ks.length-1]] = v;
}

const person = () => ({ name:'', pos:'' });
const outcome = () => ({ app:null, top:'', paid:null, unpaid:null, amount:null });
const medi = () => ({ total:null, top:'', ok:null, fail:null, amount:null });
function emptyOffice(code){
  return {
    code,
    basic: { director:'', admin:{ head:person(), staff:[] }, justice:{ head:person(), staff:[] }, community:{ head:person(), staff:[] }, address:'', contact:'' },
    proactive: {},
    fund: { lit:{ req:null, app:null, rej:null }, bail:{ req:null, app:null, rej:null } },
    victim: outcome(), defendant: outcome(),
    legal: { total:null, top:[0,1,2,3,4].map(() => ({ type:'', n:null })) },
    medAct: medi(), medOther: medi(),
    svc: { analysis:'', problems:'', solutions:'' },
    mgmt: { clinic:'', points:'', assign:'' },
    cjc: { total:null, f1:{A:null,B:null,C:null,D:null}, f2:{A:null,B:null,C:null,D:null}, committee:null, missions:[null,null,null,null,null,null,null], analysis:'', problems:'', solutions:'' },
    situations: [],
    appendix: { area:'', districts:'', population:'', info:'' },
    meta: {}
  };
}
function normOffice(code, doc){
  const o = deepMerge(emptyOffice(code), doc || {});
  while (o.legal.top.length < 5) o.legal.top.push({ type:'', n:null });
  o.legal.top = o.legal.top.slice(0, 5);
  while (o.cjc.missions.length < 7) o.cjc.missions.push(null);
  if (!Array.isArray(o.situations)) o.situations = [];
  return o;
}

// ---- derived values ----
function proTotals(o, years){
  let r = 0, d = 0;
  for (const y of years){ const v = o.proactive[y] || {}; r += num(v.r); d += num(v.d); }
  return { r, d, ongoing: Math.max(0, r - d) };
}
const cjcGradeSum = f => num(f.A) + num(f.B) + num(f.C) + num(f.D);

const SECTION_CHECK = {
  basic: o => !!(o.basic.director && o.basic.admin.head.name && o.basic.justice.head.name && o.basic.community.head.name && o.basic.address),
  proactive: (o, ys) => ys.every(y => o.proactive[y] && isNum(o.proactive[y].r) && isNum(o.proactive[y].d)),
  fund: o => isNum(o.fund.lit.req) && isNum(o.fund.bail.req),
  victim: o => isNum(o.victim.app) && isNum(o.defendant.app),
  legal: o => isNum(o.legal.total),
  mediation: o => isNum(o.medAct.total) && isNum(o.medOther.total),
  svc: o => !!o.svc.analysis,
  mgmt: o => !!(o.mgmt.clinic && o.mgmt.points && o.mgmt.assign),
  cjc: o => isNum(o.cjc.total) && o.cjc.missions.every(isNum),
  situations: o => o.situations.some(s => s && s.problem),
  appendix: o => !!(o.appendix.population || o.appendix.info)
};
function completeness(o, years){
  const done = SECTIONS.filter(s => SECTION_CHECK[s.id](o, years)).length;
  return { done, total: SECTIONS.length, pct: done / SECTIONS.length * 100 };
}

// Data-quality checks: returns [{level:'warn', text}]
function qualityIssues(o, years){
  const out = [];
  for (const y of years){
    const v = o.proactive[y]; if (!v) continue;
    if (isNum(v.r) && isNum(v.d) && num(v.d) > num(v.r)) out.push(`ปี ${y}: เรื่องที่ยุติ (${v.d}) มากกว่าเรื่องที่รับ (${v.r})`);
  }
  for (const [k, lab] of [['lit','ช่วยเหลือในการดำเนินคดี'],['bail','ขอปล่อยตัวชั่วคราว']]){
    const f = o.fund[k];
    if (isNum(f.req) && num(f.app) + num(f.rej) > num(f.req)) out.push(`กองทุนฯ (${lab}): อนุมัติ+ไม่อนุมัติ เกินจำนวนคำขอ`);
  }
  for (const [k, lab] of [['victim','ผู้เสียหาย'],['defendant','จำเลย']]){
    const v = o[k];
    if (isNum(v.app) && num(v.paid) + num(v.unpaid) > num(v.app)) out.push(`${lab}: จ่าย+ไม่จ่าย เกินจำนวนผู้ยื่นคำขอ`);
  }
  for (const [k, lab] of [['medAct','ไกล่เกลี่ยตาม พ.ร.บ.ฯ'],['medOther','ไกล่เกลี่ยอื่น']]){
    const v = o[k];
    if (isNum(v.total) && num(v.ok) + num(v.fail) > num(v.total)) out.push(`${lab}: สำเร็จ+ไม่สำเร็จ เกินจำนวนเรื่อง`);
  }
  if (isNum(o.cjc.total) && (cjcGradeSum(o.cjc.f1) + cjcGradeSum(o.cjc.f2)) > 0 && cjcGradeSum(o.cjc.f1) + cjcGradeSum(o.cjc.f2) !== num(o.cjc.total))
    out.push(`ศยช.: จำนวนตามเกรด (${cjcGradeSum(o.cjc.f1) + cjcGradeSum(o.cjc.f2)}) ไม่เท่ากับจำนวน ศยช. (${o.cjc.total})`);
  return out;
}

// ---- demo data (clearly labelled in UI, never written to the database) ----
function seededRand(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function demoOffice(code, years, idx){
  const R = seededRand(code.split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7));
  const ri = (a, b) => Math.round(a + R() * (b - a));
  const scale = [1.25, 0.7, 1.05, 1.15, 0.8][idx % 5];
  const o = emptyOffice(code);
  o.basic.director = '(ตัวอย่าง) ผู้อำนวยการ';
  o.basic.admin.head = { name:'(ตัวอย่าง) หัวหน้าฝ่ายอำนวยการ', pos:'เจ้าพนักงานธุรการชำนาญงาน' };
  o.basic.justice.head = { name:'(ตัวอย่าง) หัวหน้ากลุ่มอำนวยความยุติธรรมฯ', pos:'นิติกรชำนาญการ' };
  o.basic.community.head = { name:'(ตัวอย่าง) หัวหน้ากลุ่มพัฒนาฯ', pos:'นักวิชาการยุติธรรมชำนาญการ' };
  o.basic.address = '(ตัวอย่าง) ศาลากลางจังหวัด' + PROV[code].th;
  years.forEach((y, i) => { const r = Math.round(ri(90, 160) * scale * (1 + i * 0.08)); o.proactive[y] = { r, d: Math.round(r * (0.72 + R() * 0.22) * (i === years.length - 1 ? 0.8 : 1)) }; });
  const fund = (a, b) => { const req = Math.round(ri(a, b) * scale); const app = Math.round(req * (0.6 + R() * 0.3)); return { req, app, rej: req - app }; };
  o.fund.lit = fund(20, 45); o.fund.bail = fund(8, 25);
  const oc = () => { const app = Math.round(ri(25, 70) * scale); const paid = Math.round(app * (0.55 + R() * 0.3)); return { app, top: ['ทำร้ายร่างกาย','ละเมิด/อุบัติเหตุจราจร','ความผิดทางเพศ'][ri(0,2)], paid, unpaid: app - paid, amount: paid * ri(18, 42) * 1000 }; };
  o.victim = oc(); o.defendant = oc(); o.defendant.amount = Math.round(o.defendant.amount * 0.4);
  const total = Math.round(ri(260, 480) * scale); const types = CASE_TYPES.slice(0, 9).sort(() => R() - 0.5);
  let left = total; o.legal = { total, top: types.slice(0, 5).map((t, i) => { const n = Math.round(left * (0.32 - i * 0.04)); left -= n; return { type:t, n }; }) };
  const md = (a, b) => { const t = Math.round(ri(a, b) * scale); const ok = Math.round(t * (0.6 + R() * 0.3)); return { total:t, top: ['สัญญากู้ยืม','เช่าซื้อ/ซื้อขาย','ที่ดิน/ทรัพย์สิน','ครอบครัว/มรดก'][ri(0,3)], ok, fail: t - ok, amount: ok * ri(40, 120) * 1000 }; };
  o.medAct = md(30, 70); o.medOther = md(15, 40);
  o.svc = { analysis:'(ตัวอย่าง) ผลการให้บริการเพิ่มขึ้นจากปีก่อน', problems:'(ตัวอย่าง) บุคลากรไม่เพียงพอต่อปริมาณงาน', solutions:'(ตัวอย่าง) บูรณาการเครือข่าย ศยช.' };
  const pf = () => R() > 0.25 ? 'pass' : 'fail';
  o.mgmt = { clinic: pf(), points: pf(), assign: pf() };
  const n1 = ri(4, 9), n2 = ri(2, 6);
  const split = n => { const a = ri(0, Math.ceil(n * 0.4)), b = ri(0, n - a), c = ri(0, n - a - b); return { A:a, B:b, C:c, D:n - a - b - c }; };
  o.cjc = { total: n1 + n2, f1: split(n1), f2: split(n2), committee: (n1 + n2) * ri(9, 15), missions: MISSIONS.map(() => Math.round(ri(4, 40) * scale)), analysis:'(ตัวอย่าง) ศยช. มีบทบาทเฝ้าระวังเชิงรุกมากขึ้น', problems:'(ตัวอย่าง) คณะกรรมการบางแห่งขาดความต่อเนื่อง', solutions:'(ตัวอย่าง) จัดอบรมเสริมทักษะการไกล่เกลี่ย' };
  o.situations = [{ problem:'(ตัวอย่าง) หนี้นอกระบบในกลุ่มเกษตรกร', impact:'(ตัวอย่าง) ประชาชนถูกเอาเปรียบ', solution:'(ตัวอย่าง) คลินิกแก้หนี้เคลื่อนที่' }];
  o.appendix = { area:'', districts:'', population:'', info:'(ตัวอย่าง) ข้อมูลพื้นฐานจังหวัด' };
  o.meta = { updatedAt: new Date(Date.now() - ri(1, 72) * 3600e3).toISOString(), demo:true };
  return o;
}

function buildReport(ctx){

  const NZ = v => T(fmtNum(v, 2));
  const nm = c => PROV[c].th;
  const B = [];
  const P = (text, o = {}) => B.push(Object.assign({ t:'p', runs:[{ text }] }, o));
  const PR = (runs, o = {}) => B.push(Object.assign({ t:'p', runs }, o));
  const H1 = text => B.push({ t:'h1', text });
  const H2 = text => B.push({ t:'h2', text });
  const H3 = text => B.push({ t:'h3', text });
  const TB = (title, widths, head, body) => B.push({ t:'table', title, widths, head, body });
  const BR = () => B.push({ t:'break' });

  ], demo: !!ctx.demo, logo:true });
  else B.push({ t:'cover', lines:[

    { gap:true },
    { text:'จัดทำโดย', size:'l' },
    { text:`ศูนย์ปฏิบัติการ${g.label}`, size:'l', bold:true },
    { text:`สำนักงานยุติธรรมจังหวัด${nm(g.center)}`, size:'l' },
    { text:'สำนักงานปลัดกระทรวงยุติธรรม', size:'l' },

// ---------- HTML preview ----------
function reportHTML(blocks){
  const cellHTML = (x, tag) => {
    const a = [];
    if (x.cs) a.push(`colspan="${x.cs}"`); if (x.rs) a.push(`rowspan="${x.rs}"`);
    const cls = [x.align ? 'a-' + x.align : '', x.bold ? 'b' : '', x.shade ? 'sh' : ''].filter(Boolean).join(' ');
    const txt = x.text === 'CHECK' ? '<span class="chk" aria-label="ใช่">✓</span>' : esc(x.text).replace(/\n/g, '<br>');
    return `<${tag} ${a.join(' ')} class="${cls}">${txt}</${tag}>`;
  };
  let h = '<div class="paper">';
  for (const b of blocks){
    if (b.t === 'break'){ h += '</div><div class="paper">'; continue; }
    if (b.t === 'cover'){
      h += '<div class="cover' + (b.logo ? ' has-logo' : '') + '">' + (b.demo ? '<p class="demo-stamp">ข้อมูลตัวอย่าง — ไม่ใช่ข้อมูลจริง</p>' : '') +
        (b.logo ? '<img class="cover-logo" src="img/moj-logo.png" alt="ตรากระทรวงยุติธรรม">' : '') +
        b.lines.map(l => l.gap ? '<div class="gap"></div>' : `<p class="${l.size} ${l.bold ? 'b' : ''}">${esc(l.text)}</p>`).join('') + '</div>';
    }
    else if (b.t === 'title') h += `<h2 class="rt-title">${esc(b.text)}</h2>`;
    else if (b.t === 'h1') h += `<h3 class="rt-h1">${esc(b.text)}</h3>`;
    else if (b.t === 'h2') h += `<h4 class="rt-h2">${esc(b.text)}</h4>`;
    else if (b.t === 'h3') h += `<h5 class="rt-h3">${esc(b.text)}</h5>`;
    else if (b.t === 'toc') h += '<h2 class="rt-title">สารบัญ</h2><ol class="rt-toc">' + b.items.map(s => `<li>${esc(s)}</li>`).join('') + '</ol>';

function reportDocx(blocks, d, opts = {}){

  const AL = { center:AlignmentType.CENTER, right:AlignmentType.RIGHT, left:AlignmentType.LEFT, justify:AlignmentType.THAI_DISTRIBUTE || AlignmentType.JUSTIFIED };
  const CONTENT_W = 11906 - 1701 - 1134;
  const children = [];
  let pendingBreak = false;
  const para = (o) => { const p = new Paragraph(Object.assign({}, o, pendingBreak ? { pageBreakBefore:true } : {})); pendingBreak = false; return p; };
  const thin = { style:BorderStyle.SINGLE, size:4, color:'555555' };
  const borders = { top:thin, bottom:thin, left:thin, right:thin };
  const chk = opts.thaiNum !== undefined ? '/' : '/';
  for (const b of blocks){
    if (b.t === 'break'){ pendingBreak = true; continue; }

      const withLogo = b.logo && opts.logo;
      children.push(para({ children:[], spacing:{ before: withLogo ? 700 : 2600 } }));

      for (const l of b.lines){
        if (l.gap){ children.push(para({ children:[], spacing:{ before:1400 } })); continue; }

      }
      continue;
    }
    if (b.t === 'title'){ children.push(para({ alignment:AlignmentType.CENTER, spacing:{ after:200 }, children:[run(b.text, { bold:true, size:20 })] })); continue; }
    if (b.t === 'h1'){ children.push(para({ spacing:{ before:240, after:120 }, keepNext:true, children:[run(b.text, { bold:true, size:18 })] })); continue; }
    if (b.t === 'h2'){ children.push(para({ spacing:{ before:160, after:60 }, keepNext:true, indent:{ left:360 }, children:[run(b.text, { bold:true, size:16 })] })); continue; }
    if (b.t === 'h3'){ children.push(para({ keepNext:true, indent:{ left:720 }, children:[run(b.text, { bold:true })] })); continue; }
    if (b.t === 'toc'){
      children.push(para({ alignment:AlignmentType.CENTER, spacing:{ after:200 }, children:[run('สารบัญ', { bold:true, size:20 })] }));
      b.items.forEach(s => children.push(para({ spacing:{ after:80 }, indent:{ left:360, hanging:360 }, children:[run(s)] })));
      continue;
    }
    if (b.t === 'p'){
      children.push(para({
        alignment: b.align ? AL[b.align] : (b.justify ? AL.justify : AlignmentType.LEFT),
        spacing:{ before: b.space ? 120 : 0 },
        indent: Object.assign({}, b.indent ? { left: 720 * b.indent } : {}, b.first ? { firstLine: 1418 } : {}),
        children: b.runs.map(r => run(r.text, { bold: r.bold || b.bold }))
      }));
      continue;
    }
    if (b.t === 'table'){
      if (b.title) children.push(para({ spacing:{ before:160, after:60 }, keepNext:true, children:[run(b.title, { bold:true })] }));
      const totalW = b.widths.reduce((a, x) => a + x, 0);
      const colW = b.widths.map(w => Math.round(w / totalW * CONTENT_W));
      const mkRow = (r, isHead) => new TableRow({ tableHeader:isHead, cantSplit:true, children: r.map((x, ci) => x && new TableCell({
        columnSpan: x.cs || 1, rowSpan: x.rs || 1, verticalAlign: VerticalAlign.CENTER, borders,
        width:{ size: colW.slice(ci, ci + (x.cs || 1)).reduce((a, v) => a + v, 0), type:WidthType.DXA },
        margins:{ top:20, bottom:20, left:70, right:70 },
        shading: (isHead || x.shade) ? { fill: isHead ? 'E6E9F0' : 'F2F3F6', type:ShadingType.CLEAR, color:'auto' } : undefined,
        children: String(x.text === 'CHECK' ? chk : x.text).split('\n').map(line => new Paragraph({ alignment: AL[x.align] || AlignmentType.LEFT, children:[run(line, { bold: x.bold || isHead, size:14 })] }))
      })).filter(Boolean) });
      const rows = [...b.head.map(r => mkRow(r, true)), ...b.body.map(r => mkRow(r, false))];
      const t = new Table({ rows, width:{ size:CONTENT_W, type:WidthType.DXA }, columnWidths: colW, layout: TableLayoutType.FIXED });
      if (pendingBreak){ children.push(para({ children:[] })); }
      children.push(t);
      children.push(new Paragraph({ children:[], spacing:{ after:60 } }));
      continue;
    }
  }
  return new Document({
    creator: opts.creator || 'ระบบรายงานกลุ่มจังหวัด', title: opts.title || 'รายงานผลการปฏิบัติราชการ',

        first: new Header({ children:[ new Paragraph({ children:[] }) ] })
      },
      children
    }]
  });
}

async function resolveNames(ids){

const KEEP_FORMS = '#reg-form, #cfg-form, #dl-form';
const fieldKey = el => el.id || (el.name + '=' + el.value);
function snapForms(){
  if (!S._touched) return null;
  const st = { vals:{}, focus:null };
  $$(KEEP_FORMS).forEach(f => { if (!S._touched[f.id]) return; $$('input,select,textarea', f).forEach(el => { st.vals[fieldKey(el)] = (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value; }); });
  const ae = document.activeElement; if (ae && ae.id && ae.closest && ae.closest(KEEP_FORMS)) st.focus = { id:ae.id, s:ae.selectionStart, e:ae.selectionEnd };
  return st;
}
function restoreForms(st){
  if (!st) return;
  $$(KEEP_FORMS).forEach(f => $$('input,select,textarea', f).forEach(el => { const k = fieldKey(el); if (k in st.vals){ if (el.type === 'checkbox' || el.type === 'radio') el.checked = st.vals[k]; else el.value = st.vals[k]; } }));
  if (st.focus){ const el = document.getElementById(st.focus.id); if (el){ try { el.focus({ preventScroll:true }); if (st.focus.s != null) el.setSelectionRange(st.focus.s, st.focus.e); } catch (e){} } }
}

async function saveDeadline(){

  const doc = { title, date, time:$('#dl-time').value, kind:$('#dl-kind').value, offices: offs.length === S.group.members.length ? [] : offs,
    remind: $$('input[name="dl-rem"]:checked').map(x => Number(x.value)), note:$('#dl-note').value.trim(), updatedAt:new Date().toISOString(), by:S.me.id };
  try {
    if (S.calEdit){ const old = S.deadlines.find(x => x.id === S.calEdit) || {}; await S.db.doc('deadlines/' + S.calEdit).set(Object.assign({}, doc, { sent: old.sent || {}, official: !!old.official })); }

}

function updateCalcs(){
  const form = $('#entry-form'); if (!form) return;
  const val = p => { const el = form.querySelector(`[data-p="${p}"]`); return el && el.value !== '' ? Number(el.value) : null; };
  $$('[data-calc]', form).forEach(el => {
    const kind = el.dataset.calc, of = el.dataset.of; let out = '-';
    if (kind === 'sum'){ const vs = of.split('|').map(val); if (vs.some(x => x != null)) out = fmtNum(vs.reduce((a, x) => a + (x || 0), 0)); }
    else if (kind === 'diff'){ const [a, b] = of.split('|').map(val); if (a != null || b != null) out = fmtNum((a || 0) - (b || 0)); }
    else if (kind === 'sumdiff'){ const [A, B] = of.split('#'); const s = x => x.split('|').map(val).reduce((t, y) => t + (y || 0), 0); out = fmtNum(Math.max(0, s(A) - s(B))); }
    else if (kind === 'rate'){ const [a, b] = of.split('|').map(val); if (b) out = fmtNum(pct(a || 0, b), 1) + '%'; }
    el.textContent = out;
  });
}
const LIST_PATHS = [/^basic\.\w+\.staff$/, /^situations$/, /^advisors$/, /^authors$/, /^legal\.top$/, /^cjc\.missions$/];
function listify(o, path){
  if (!isObj(o)) return o;
  const r = {}; for (const k of Object.keys(o)) r[k] = listify(o[k], path ? path + '.' + k : k);
  if (LIST_PATHS.some(re => re.test(path))) return Object.keys(r).filter(k => /^\d+$/.test(k)).sort((a, b) => a - b).map(k => r[k]);
  return r;
}
function collectForm(form){
  const out = {};
  $$('[data-p]', form).forEach(el => {
    let v;
    if (el.type === 'radio'){ if (!el.checked) return; v = el.value; }
    else if (el.dataset.t === 'num'){ v = el.value === '' ? null : Number(el.value); if (v != null && (isNaN(v) || v < 0)) v = null; }
    else v = el.value.trim();
    setPath(out, el.dataset.p, v);
  });
  return listify(out, '');
}

const csvCell = x => { const s = String(x == null ? '' : x); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
async function exportCsv(btn){
  await loadAllVisits();
  const id = ($('#csv-set') && $('#csv-set').value) || S.dataSet, cur = datasets().find(d => d.id === id); if (!cur) return;
  const csv = '﻿' + [cur.cols, ...cur.rows].map(r => r.map(csvCell).join(',')).join('\r\n');

}
async function exportXlsx(btn){
  await withBusy(btn, 'กำลังสร้างไฟล์…', async () => {
    await loadAllVisits();
    const X = await loadScript(LIBS.xlsx), wb = X.utils.book_new();
    datasets().forEach(d => { const ws = X.utils.aoa_to_sheet([d.cols, ...d.rows]); ws['!cols'] = d.cols.map((c, i) => ({ wch: Math.min(48, Math.max(10, String(c).length + 2, ...d.rows.map(r => String(r[i] == null ? '' : r[i]).length * 0.9))) })); X.utils.book_append_sheet(wb, ws, d.name.replace(/[\[\]:*?/\\]/g, ' ').slice(0, 31)); });
    const meta = X.utils.aoa_to_sheet([[S.group.appName + ' · ' + S.group.label], ['ปีงบประมาณ', S.group.fy], ['ส่งออกเมื่อ', thDate(new Date().toISOString())], ['ชนิดข้อมูล', isDemo() ? 'ข้อมูลตัวอย่าง (ไม่ใช่ข้อมูลจริง)' : 'ข้อมูลจริงจากฐานข้อมูล'], ['สำนักงานในกลุ่ม', S.group.members.map(nm).join(', ')]]);
    meta['!cols'] = [{ wch:22 }, { wch:60 }]; X.utils.book_append_sheet(wb, meta, 'ข้อมูลไฟล์');
    const buf = X.write(wb, { bookType:'xlsx', type:'array' });
    await offerFile(`ฐานข้อมูล_${S.group.label.replace(/\s+/g, '')}_${S.group.fy}${isDemo() ? '_ตัวอย่าง' : ''}.xlsx`, new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));

}

function manJump(i){
  const h = $('#man-' + i); if (!h) return;

  try { h.focus({ preventScroll:true }); } catch (e){}
}
async function exportManualPdf(btn){

async function leaveOk(){
  if (S.view !== 'entry' || !S.entry.dirty) return true;
  if (S.entry.section !== 'g-activities' && await saveEntry(null, { auto:true })) return true;
  return confirmLeave();
}
async function goStep(id){
  if (!(await leaveOk())) return false;
  S.entry.section = id; S.entry.dirty = false; S.entry.sig = ''; renderEntry(); window.scrollTo({ top:0 });
  return true;
}
function confirmLeave(){
  if (!S.entry.dirty) return true;
  if (S._leaveArmed && Date.now() - S._leaveArmed < 5000){ S._leaveArmed = 0; S.entry.dirty = false; return true; }
  S._leaveArmed = Date.now(); toast('มีข้อมูลที่ยังไม่บันทึก กดอีกครั้งเพื่อออกโดยไม่บันทึก', 'err'); return false;
}
async function recordSent(id){

  try { await S.db.doc('deadlines/' + id).update({ sent:{ [todayKey()]:{ by:S.me.id, at:new Date().toISOString() } } }); } catch (e){}
}

      case 'goto-sec': if (!(await leaveOk())) return; S.entry.office = t.dataset.o; S.entry.section = val; S.entry.dirty = false; S.entry.sig = ''; setView('entry'); break;
      case 'goto-office': if (!(await leaveOk())) return; S.entry.office = val; if (S.entry.section.startsWith('g-')) S.entry.section = 'basic'; S.entry.dirty = false; S.entry.sig = ''; setView('entry'); break;

      case 'step-go': await goStep(val); break;
      case 'copy-link': { const link = S.group.appLink || location.href; try { await navigator.clipboard.writeText(link); toast('คัดลอกลิงก์แล้ว'); } catch (e){ toast('ลิงก์ระบบ: ' + link); } break; }
      case 'save': saveEntry(null); break;
      case 'save-next': saveEntry(val); break;
      case 'add-row': { const list = $(`[data-list="${t.dataset.base}"]`); const i = S.rowSeq++; const tpl = t.dataset.tpl;
        list.insertAdjacentHTML('beforeend', tpl === 'sit' ? sitRow(i, {}) : staffRow(t.dataset.base, i, {}));
        S.entry.dirty = true; const f = list.lastElementChild.querySelector('input,textarea'); f && f.focus(); break; }
      case 'del-row': t.closest('[data-row]').remove(); S.entry.dirty = true; break;
      case 'reload-form': S.entry.dirty = false; S.entry.sig = ''; renderEntry(); break;
      case 'add-activity': await addActivity(); break;
      case 'del-activity': if (t.dataset.confirm !== '1'){ t.dataset.confirm = '1'; t.textContent = 'ยืนยันลบ'; return; }
        try { await S.db.doc('activities/' + val).delete(); toast('ลบกิจกรรมแล้ว'); } catch (e){ toast(dbErr(e), 'err'); } break;
      case 'act-pj': try { await S.db.doc('activities/' + val).update({ pj:true }); } catch (e){ toast(dbErr(e), 'err'); } break;
      case 'exp-docx': exportDocx(t); break;
      case 'exp-pptx': exportPptx(t); break;
      case 'dl-scope': S.dlScope = val; renderDownloads(); break;
      case 'exp-pdf': exportPdf(t); break;
      case 'manual-pdf': exportManualPdf(t); break;
      case 'man-jump': manJump(val); break;
      case 'nf-logout': if (window.NF) NF.logout(); break;
      case 'exp-xlsx': exportXlsx(t); break;
      case 'exp-csv': exportCsv(t); break;
      case 'dataset': S.dataSet = val; S._tableOpen = true; renderDownloads(); break;
      case 'demo-off': S.demoPref = false; renderAll(); break;
      case 'demo-mode': S.demoPref = t.value === 'auto' ? null : t.value === 'on'; S.demoKey = ''; renderAll(); break;
      case 'approve': await approve(val); break;
      case 'reject': if (t.dataset.confirm !== '1'){ t.dataset.confirm = '1'; t.textContent = 'ยืนยันลบคำขอ'; return; }
        try { await S.db.doc('registrations/' + val).delete(); toast('ลบคำขอแล้ว'); } catch (e){ toast(dbErr(e), 'err'); } break;
      case 'revoke': if (t.dataset.confirm !== '1'){ t.dataset.confirm = '1'; t.textContent = 'ยืนยันยกเลิก'; return; }
        try { await S.db.doc('approvals/' + val).delete(); toast('ยกเลิกสิทธิ์แล้ว'); } catch (e){ toast(dbErr(e), 'err'); } break;
      case 'cal-prev': S.cal.m--; if (S.cal.m < 0){ S.cal.m = 11; S.cal.y--; } renderCalendar(); break;
      case 'cal-next': S.cal.m++; if (S.cal.m > 11){ S.cal.m = 0; S.cal.y++; } renderCalendar(); break;
      case 'cal-today': { const d = new Date(); S.cal = { y:d.getFullYear(), m:d.getMonth() }; S.calSel = todayKey(); renderCalendar(); break; }
      case 'cal-day': S.calSel = val; renderCalendar(); break;
      case 'cal-new': S.calForm = true; S.calEdit = null; if (S.view !== 'calendar') setView('calendar'); else { renderCalendar(); window.scrollTo({ top:0 }); } break;
      case 'cal-edit': S.calForm = true; S.calEdit = val; renderCalendar(); window.scrollTo({ top:0 }); break;
      case 'cal-cancel': untouch('dl-form'); S.calForm = false; S.calEdit = null; renderCalendar(); break;
      case 'cal-del': if (t.dataset.confirm !== '1'){ t.dataset.confirm = '1'; t.textContent = 'ยืนยันลบ'; return; }
        try { await S.db.doc('deadlines/' + val).delete(); toast('ลบกำหนดส่งแล้ว'); } catch (e){ toast(dbErr(e), 'err'); } break;
      case 'dl-line': { const w = t.dataset.where, box = document.getElementById(`mb-${w}-${val}`), d = S.deadlines.find(x => x.id === val); if (!box || !d) return;
        if (box.hidden){ box.innerHTML = msgBoxHTML(d, w); box.hidden = false; S.openMsg = [w, val]; } else { box.hidden = true; S.openMsg = null; } break; }

    }
  });

    else if (t.id === 'tw-office'){ S.twinSel = t.value; renderOverview(); }
    else if (t.id === 'tw-scrub'){ TW.scrubbing = false; }
    else if (t.id === 'entry-office'){ const v = t.value; t.value = S.entry.office; leaveOk().then(ok => { if (!ok) return; S.entry.office = v; S.entry.dirty = false; S.entry.sig = ''; renderEntry(); }); }

    else if (t.id === 'csv-set'){ S.dataSet = t.value; }
  });
  document.addEventListener('input', ev => {

  setInterval(() => renderChrome(), 60000);
}

let _visUnsub = null;

  S.visitsDay = todayKey();
  _visUnsub = S.db.collection('visits').where('date', '==', S.visitsDay).onSnapshot(q => { S.visits = q.docs.map(d => Object.assign({ _id:d.id }, d.data())); schedule(); }, e => console.warn('visits', e));

async function boot(){
  const h = (location.hash || '').replace('#', '');
  bind();
  setView(VIEWS.includes(h) ? h : 'home');
  const C = window.claude;
  if (!C || typeof C.use !== 'function'){ S.booted = true; renderAll(); return; }
  const safe = p => Promise.resolve(p).catch(() => null);
  const [db, user, dl] = await Promise.all([safe(C.use('db')), safe(C.use('user')), safe(C.use('downloads'))]);
  S.db = db; S.user = user; S.downloads = dl;
  if (user){
    try { const me = await user.me(); S.me = { id: me.id, name: me.name || '', avatar: me.avatarUrl, isOwner: !!me.isOwner, isAdmin: !!(me.canEdit || me.isOwner), canWrite: null }; } catch (e){}
    try { S.me.canWrite = await user.can('data.write'); } catch (e){}
  }
  S.booted = true;
  if (!db){ renderAll(); return; }

function mkPerson(office, min, ch, svc, cs, out, id, real){
  const R = seededRand(h32(id)), sv = svcOf(svc);
  const dur = sv.dur[0] + R() * (sv.dur[1] - sv.dur[0]);
  return { id, office, min, ch: CH.some(c => c.id === ch) ? ch : 'walk', svc: sv.id, cs: cs || '', out: OUT.some(o => o.id === out) ? out : 'done', intake: 4 + R() * 6, dur: isRemote(ch) ? dur * 0.45 : dur, o: R(), real };
}
function realEvents(){
  const out = [], tk = todayKey();
  (S.visits || []).filter(v => v.date === tk && S.group.members.includes(v.office)).forEach(v => (v.events || []).forEach(e => {
    const [hh, mm] = String(e.t || '').split(':').map(Number); if (isNaN(hh)) return;
    const n = Math.max(1, Math.min(20, num(e.n) || 1));
    for (let i = 0; i < n; i++) out.push(mkPerson(v.office, hh * 60 + (mm || 0) + i * 0.6, e.ch, e.svc, e.case, e.out, (e.id || v._id + hh + mm) + '-' + i, true));
  }));
  return out.sort((a, b) => a.min - b.min);
}
const gauss = R => (R() + R() + R() - 1.5) / 1.5;
function synthEvents(dk){
  const res = [], g = S.group, Y = g.years, last = Y[Y.length - 1];
  g.members.forEach(code => {
    const o = office(code);
    const w = { consult:num(o.legal.total), fund:num(o.fund.lit.req) + num(o.fund.bail.req), comp:num(o.victim.app) + num(o.defendant.app), med:num(o.medAct.total) + num(o.medOther.total), help:num((o.proactive[last] || {}).r) };
    let tot = Object.values(w).reduce((a, b) => a + b, 0);
    if (!tot){ Object.assign(w, { consult:300, fund:40, comp:60, med:80, help:120 }); tot = 600; }
    const R = seededRand(h32(code + dk));
    const n = Math.max(2, Math.round(tot / 245 * (0.8 + R() * 0.5)));
    const types = o.legal.top.filter(t => t.type).map(t => t.type);
    const pr = o.proactive[last] || {}, resolve = num(pr.r) ? num(pr.d) / num(pr.r) : 0.75;
    const mt = num(o.medAct.total) + num(o.medOther.total), medOk = mt ? (num(o.medAct.ok) + num(o.medOther.ok)) / mt : 0.7;
    for (let i = 0; i < n; i++){
      let r = R() * tot, svc = 'consult'; for (const k of Object.keys(w)){ r -= w[k]; if (r <= 0){ svc = k; break; } }
      let m = R() < 0.62 ? 600 + gauss(R) * 70 : 840 + gauss(R) * 55;
      m = Math.max(OPEN_MIN + 3, Math.min(CLOSE_MIN - 25, m));
      const cr = R();
      const ch = svc === 'help' && cr < 0.55 ? 'mobile' : cr < 0.6 ? 'walk' : cr < 0.78 ? 'phone' : cr < 0.9 ? 'online' : 'cjc';
      const q = R();
      const out = svc === 'med' ? (q < medOk ? 'done' : q < medOk + 0.15 ? 'pending' : 'refer')
        : (svc === 'fund' || svc === 'comp') ? (q < 0.62 ? 'pending' : q < 0.9 ? 'done' : 'refer')
        : svc === 'help' ? (q < resolve ? 'done' : 'pending') : (q < 0.78 ? 'done' : q < 0.93 ? 'refer' : 'pending');
      const cs = types.length && R() < 0.8 ? types[Math.floor(R() * types.length)] : CASE_TYPES[Math.floor(R() * CASE_TYPES.length)];
      res.push(mkPerson(code, m, ch, svc, cs, out, `sim-${code}-${dk}-${i}`, false));
    }
  });
  return res.sort((a, b) => a.min - b.min);
}

function along(pts, f){
  f = Math.max(0, Math.min(1, f));
  const seg = []; let L = 0;
  for (let i = 1; i < pts.length; i++){ const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
  let t = f * L;
  for (let i = 0; i < seg.length; i++){ if (t <= seg[i] || i === seg.length - 1){ const k = seg[i] ? Math.min(1, t / seg[i]) : 1; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]; } t -= seg[i]; }
  return pts[pts.length - 1];
}
// where every person of one office is at sim time s
function floorState(s, evs, code){
  const W = walkW(), out = [];
  const list = evs.filter(e => e.office === code);
  const walkers = list.filter(e => isWalk(e.ch)).map(e => { const t1 = e.min, t2 = t1 + e.intake, t3 = t2 + W, t4 = t3 + e.dur; return { e, t0:t1 - W, t1, t2, t3, t4, t5:t4 + W }; });
  const active = walkers.filter(p => s >= p.t0 && s < p.t5);
  const atIntake = active.filter(p => s < p.t2).sort((a, b) => a.t1 - b.t1);
  const deskQ = {}; SVC.forEach(v => deskQ[v.id] = active.filter(p => p.e.svc === v.id && s >= p.t2 && s < p.t4).sort((a, b) => a.t3 - b.t3));
  active.forEach(p => {
    const k = SVC.findIndex(v => v.id === p.e.svc), iq = atIntake.indexOf(p), jd = deskQ[p.e.svc].indexOf(p);
    const slotI = FL.intake(Math.max(0, iq)), slotD = FL.seat(k, Math.min(4, Math.max(0, jd)));
    let pos, ph;
    if (s < p.t1){ ph = 'in'; pos = along([FL.doorOut, FL.doorIn, [FL.doorIn[0], slotI[1]], slotI], (s - p.t0) / W); }
    else if (s < p.t2){ ph = 'intake'; pos = slotI; }
    else if (s < p.t3){ ph = 'walk'; pos = along([slotI, [FL.corridor, slotI[1]], [FL.corridor, slotD[1]], slotD], (s - p.t2) / W); }
    else if (s < p.t4){ ph = 'desk'; pos = slotD; }
    else { ph = 'out'; const ex = p.e.out === 'refer' ? [FL.referIn, FL.referOut] : [FL.doorIn, FL.doorOut];
      pos = along([slotD, [FL.corridor, slotD[1]], [FL.corridor, FL.hall], [ex[0][0], FL.hall], ex[1]], (s - p.t4) / W); }
    out.push({ id:p.e.id, x:pos[0], y:pos[1], svc:p.e.svc, ph, remote:false });
  });
  const remotes = list.filter(e => isRemote(e.ch) && s >= e.min && s < e.min + e.dur).sort((a, b) => a.min - b.min);
  remotes.forEach((e, i) => { const [x, y] = FL.remote(i); out.push({ id:e.id, x, y, svc:e.svc, ph:'remote', remote:true }); });
  return { people: out, inside: active.length, list, walkers };
}

// ---------- twin events (wired from app bind) ----------
function twinClick(a, val){
  switch (a){
    case 'tw-mode': TW.mode = val; TW.auto = false; twToNow(); renderOverview(); return true;
    case 'tw-speed': twSet(twNow(), Number(val), true); renderTwinControls(); return true;
    case 'tw-play': if (TW.playing) twSet(twNow(), null, false); else { let s = twNow(); if (s >= DAY_END) s = 480; twSet(s, null, true); } renderTwinControls(); return true;
    case 'tw-replay': twSet(495, 300, true); renderTwinControls(); return true;
    case 'tw-now': TW.mode === 'sim' ? twToNow() : twSet(nowMin(), 1, true); renderTwinControls(); return true;
    case 'visit-new': openVisitForm(val || S.twinSel); return true;
    case 'visit-close': closeVisitForm(); return true;
  }
  return false;
}
function renderTwinControls(){
  $$('[data-act="tw-speed"]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === TW.speed)));
  const pb = $('#tw-play'); if (pb) pb.textContent = TW.playing ? 'หยุดชั่วคราว' : 'เล่นต่อ';
  TW.lastStats = 0;
}

// helpers used by the deck (no DOM)
function compactThNum(v){ const a = Math.abs(num(v)); return a >= 1e6 ? fmtNum(v / 1e6, 2) + ' ล้าน' : a >= 1e5 ? fmtNum(v / 1e5, 1) + ' แสน' : fmtNum(v, 0); }
function daysUntilKey(s, today){ const p = x => { const [y, m, d] = String(x).split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(s) - p(today)) / 864e5); }
function thDateShort(s){ const M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']; const [y, m, d] = String(s).split('-').map(Number); return `${d} ${M[m - 1]} ${String(y + 543).slice(2)}`; }
